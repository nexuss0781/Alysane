name: End-to-end real-model gates

on:
  workflow_dispatch:
    inputs:
      n_train:
        description: 'Training contexts'
        required: false
        default: '256'
      n_hold:
        description: 'Holdout contexts'
        required: false
        default: '64'
      n_ctx:
        description: 'Context length'
        required: false
        default: '64'
  push:
    tags: ['e2e-*']

jobs:
  gates:
    name: Pinned SmolLM-135M end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libopenblas-dev liblapacke-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python (oracle + tokenisation only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Restore pinned SmolLM-135M
        run: |
          bash tools/download_model.sh
          echo "c7a387d6fe81ca6dd304aeb809bda3932ff1bbef3ca41c9484502f2f448dc093  models/model.safetensors" | sha256sum -c -

      - name: Prepare corpus (offline token conversion)
        run: python tools/prepare_data.py
        env:
          ALYSANE_N_TRAIN: ${{ github.event.inputs.n_train || '256' }}
          ALYSANE_N_HOLD: ${{ github.event.inputs.n_hold || '64' }}
          ALYSANE_N_CTX: ${{ github.event.inputs.n_ctx || '64' }}

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Unit tests + analytic selftest
        run: |
          ./build/alysane_unit_tests
          ./build/alysane selftest

      - name: C1 parity — C++ side
        env:
          OPENBLAS_NUM_THREADS: '4'
          OMP_NUM_THREADS: '4'
          ALYSANE_THREADS: '4'
        run: ./build/alysane parity models data/parity.bin reports/parity_cpp.bin

      - name: C1 parity — independent HuggingFace oracle
        env:
          OPENBLAS_NUM_THREADS: '4'
          OMP_NUM_THREADS: '4'
        run: python tools/parity_reference.py

      - name: Report CPU capabilities
        run: |
          lscpu | grep -E 'Model name|Flags' | head -2
          grep -o -m1 -E 'avx512f|avx2|fma' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          g++ --version | head -1

      - name: Core gates G1-G7
        continue-on-error: true
        id: core_gates
        env:
          OPENBLAS_NUM_THREADS: '4'
          OMP_NUM_THREADS: '4'
          ALYSANE_THREADS: '4'
        run: ./build/alysane gates models data reports

      - name: Diagnose crash under ASan (only if core gates crashed)
        if: steps.core_gates.outcome == 'failure'
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
          ALYSANE_THREADS: '2'
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          cmake --build build-asan -j$(nproc) --target alysane
          ./build-asan/alysane gates models data reports-asan 2>&1 | tail -60 || true
          echo "=== scalar ISA retry ==="
          ALYSANE_SIMD=scalar ./build/alysane gates models data reports-scalar 2>&1 | tail -20 || true

      - name: Completion gates G8-G12 (real model)
        env:
          OPENBLAS_NUM_THREADS: '4'
          OMP_NUM_THREADS: '4'
          ALYSANE_THREADS: '4'
        run: ./build/alysane complete models data reports

      - name: A1 measurement protocol (alysane-probe)
        continue-on-error: true
        id: probe
        env:
          OPENBLAS_NUM_THREADS: '4'
          OMP_NUM_THREADS: '4'
          ALYSANE_THREADS: '4'
          ALYSANE_PROBE_GRID: '48'
          ALYSANE_PROBE_B: '20'
          ALYSANE_PROBE_M: '20000'
          ALYSANE_PROBE_LANDMARKS: '64'
        run: ./build/alysane probe models data reports

      - name: A1 verdict summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('reports/probe_report.json')
          if not p.exists():
              print('NO PROBE REPORT'); raise SystemExit(0)
          r = json.loads(p.read_text())
          print('=== A1 MEASUREMENT PROTOCOL ===')
          print('final_verdict:', r['final_verdict'], '| branch:', r['final_branch'])
          for m in r['metrics']:
              pl = m['plateau']
              print(f"  {m['metric']:20s} plateau={pl['valid']} k={pl['k']} "
                    f"M={m['margin_usable']:.6f} M_req={m['margin_required']:.6f} "
                    f"verdict={m['verdict']} branch={m['branch']}")
              print(f"    H1={m['H1']['pass']} H2={m['H2']['pass']} H3={m['H3']['pass']} "
                    f"tau95={m['tau95']:.6f} capture_vacuous={m['capture_audit']['filter_vacuous']}")
          PY

      - name: Independent certificate oracle (NumPy)
        run: python tools/verify_certificates.py

      - name: Build report
        run: python tools/make_report.py

      - name: Gate summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('reports/gates.json')
          if not p.exists():
              print('NO GATES PRODUCED'); raise SystemExit(1)
          g = json.loads(p.read_text())
          print('=== GATE RESULTS ===')
          for k, v in sorted(g.get('gates', {}).items()):
              print(f'{k:34s} {v}')
          print('original_spec_overall:', g.get('original_spec_overall'))
          print('amended_overall:      ', g.get('amended_overall'))
          print('completion_status:    ', g.get('completion_status'))
          ng = g.get('no_go_gates') or []
          if ng:
              print('')
              print('*** EXPLICIT NO-GO (falsified original assumption): ' + ', '.join(ng) + ' ***')
              print('*** replaced by: ' + json.dumps(g.get('replacement_for_no_go')) + ' ***')
          print('ready_for_next_component:', g.get('ready_for_next_component'))
          PY

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alysane-gates
          path: |
            reports/gates.json
            reports/parity.json
            reports/certificates.json
            reports/probe_report.json
            reports/report.md
            reports/report.html
            reports/knowledge_manifest.json
            reports/self_weights.alys
            data/manifest.json
          if-no-files-found: warn

      - name: Enforce completion criteria
        run: |
          python - <<'PY'
          import json, pathlib, sys
          g = json.loads(pathlib.Path('reports/gates.json').read_text())
          status = g.get('completion_status')
          # CI is green only when every gate except the explicitly documented
          # falsified assumption passes. The NO-GO is printed above and recorded
          # in gates.json; it is never silently converted into a pass.
          ok = status in ('COMPLETE', 'COMPLETE_WITH_EXPLICIT_NO_GO')
          print('completion_status =', status, '->', 'OK' if ok else 'BLOCKED')
          sys.exit(0 if ok else 1)
          PY
